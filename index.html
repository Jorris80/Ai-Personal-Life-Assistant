  return '<h1 style="margin-bottom:14px">Tentang</h1><div class="stack"><div class="card stack"><div class="row">' + I.sparkL + '<div><h2>' + esc(a.name) + '</h2><div class="small muted">Versi aplikasi <b>' + esc(VERSION) + '</b> · server ' + esc(a.version) + ' · build ' + esc(a.build) + '</div></div></div><div class="small muted">Mode: ' + (GAS ? 'Web App Apps Script' : 'PWA (dapat dipasang & dibuka offline)') + ' · ID Instalasi ' + esc(S.b.install_id) + '</div>' +
    '<div class="row wrap"><button class="btn" data-act="legal" data-k="terms">Syarat & Ketentuan</button><button class="btn" data-act="legal" data-k="privacy">Pemberitahuan Privasi</button><button class="btn" data-act="legal" data-k="oss">Lisensi & atribusi</button>' + (GAS ? '' : '<button class="btn" data-act="pwa.update">Periksa pembaruan</button>') + '</div></div>' +
    '<div class="card"><h2>Agen & tool terdaftar</h2><p class="small muted" style="margin:6px 0">Asisten hanya dapat memakai tool di daftar ini; semuanya divalidasi server.</p><div class="row wrap" style="gap:6px">' + S.b.tools.map(function (t) { return '<span class="tag ' + (t.risk === 'high' ? 'bad' : t.risk === 'medium' ? 'warn' : 'ok') + '">' + esc(t.id) + ' · ' + esc(t.risk) + '</span>'; }).join('') + '</div></div></div>';
};
ACT.legal = function (el) { var k = el.getAttribute('data-k'); modal(LEGAL[k][0], '<div class="legal">' + LEGAL[k][1] + '</div>'); };
ACT['pwa.update'] = function () { if (!navigator.serviceWorker) return toast('Service worker tidak tersedia.'); navigator.serviceWorker.getRegistration().then(function (r) { if (!r) return toast('Belum terpasang sebagai PWA.'); r.update().then(function () { toast('Versi terbaru akan dipakai saat aplikasi dibuka ulang.', 'ok'); }); }); };

// ---------- event global & inisialisasi ----------
function initApp() {
  applyTheme(); Nav.init();
  document.addEventListener('click', function (e) { var el = e.target.closest('[data-act]'); if (!el || el.disabled) return; if (el.tagName === 'A') e.preventDefault(); var fn = ACT[el.getAttribute('data-act')]; if (fn) fn(el, e); });
  document.addEventListener('submit', function (e) { var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); var fn = FORM[f.getAttribute('data-form')]; if (fn) fn(formObj(f), f); });
  document.addEventListener('change', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-chg'); if (k && CHG[k]) CHG[k](e.target, e); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('#lb')) closeLb(); else if (S.modal) closeModal(); } });
  window.addEventListener('online', function () { setOnline(true); refresh(); });
  window.addEventListener('offline', function () { setOnline(false); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) persistNow(); if (!document.hidden && S.tok) { applyTheme(); flush(); if (Date.now() - lastRefresh > 60000) refresh(); } });
  setInterval(function () { if (S.tok) { flush(); remCheck(); } }, 30000);
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { } }
  window.addEventListener('pagehide', persistNow);
  if (S.tok && S.b) { replayQueue(); render(true); flush(); refresh(); }            // tampil seketika dari cache, lalu segarkan di latar
  else if (S.tok) { $('#root').innerHTML = '<div class="splash"><div class="spin"></div></div>'; call('boot', {}).then(function (b) { applyBoot(b); render(true); }).catch(function (e) { if (S.tok) { clearLocal(); renderAuth(); loadPublic(); if (e.offline) toast(e.message, 'err'); } }); }
  else { renderAuth(); loadPublic(); }
}
var remSeen = LS.get('apla.rem', {});
function remCheck() { // pengingat lokal saat aplikasi terbuka (juga saat offline)
  if (!S.b) return; var now = Date.now();
  D('reminders').forEach(function (r) { var k = r.id + r.remind_at; if (r.status === 'pending' && new Date(r.remind_at).getTime() <= now && now - new Date(r.remind_at).getTime() < 86400000 && !remSeen[k]) { remSeen[k] = 1; LS.set('apla.rem', remSeen); toast('⏰ ' + r.title); try { if (window.Notification && Notification.permission === 'granted') new Notification('Pengingat', { body: r.title }); } catch (e) { } } });
}

initApp();
if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
